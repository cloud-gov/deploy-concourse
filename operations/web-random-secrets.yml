# Set the web job's client_id/client_secret (used when logging into the web
# interface) and worker_gateway.client_id/client_secret (used by workers when
# requesting a token from the web node) to BOSH-managed random values.
#
# See:
# https://github.com/concourse/concourse-bosh-release/blob/master/jobs/web/spec#L412
# https://github.com/concourse/concourse-bosh-release/blob/master/jobs/web/spec#L2050

- type: replace
  path: /instance_groups/name=web/jobs/name=web/properties/client_secret?
  value: ((web_client_secret))

- type: replace
  path: /instance_groups/name=web/jobs/name=web/properties/worker_gateway/client_secret?
  value: ((web_worker_gateway_client_secret))

- type: replace
  path: /variables/-
  value:
    name: web_client_secret
    type: password

- type: replace
  path: /variables/-
  value:
    name: web_worker_gateway_client_secret
    type: password